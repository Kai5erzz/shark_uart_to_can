# DAPLink / CMSIS-DAP via SWD. Works with HID and bulk probes.
source [find interface/cmsis-dap.cfg]
transport select swd
source [find target/stm32g4x.cfg]
# Set the speed AFTER the target script, which otherwise selects 2000 kHz
# both at load time and in its reset-start handler.
adapter speed 500
$_TARGETNAME configure -event reset-start { adapter speed 500 }
# The board needs SWDIO, SWCLK, GND and a target voltage reference.
# NRST is optional. Do not force connect-under-reset without that wire.
reset_config none
cortex_m reset_config sysresetreq

# ---------------------------------------------------------------------------
# Reset boot option (FLASH_OPTR).
#
# This G431 only starts the application when the option bytes select main
# Flash:
#   nSWBOOT0 (bit 26) = 0  -> BOOT0 is taken from the nBOOT0 option bit
#   nBOOT0   (bit 27) = 1  -> BOOT0 = 0 -> main Flash
# The stock/default value 0xF3EFF8AA has nBOOT0=0, which selects the system
# bootloader: every reset stops in the boot ROM, the reset handler at
# 0x08000000 is never reached and the reset-entry breakpoint below times out.
#
# 'shark_fix_boot' writes only bit 27 (RDP, BOR, WRP, PCROP and all other
# option bits are preserved) and reloads the option bytes. Run it once:
#   openocd -f openocd/daplink_stm32g4.cfg -c shark_fix_boot
# ---------------------------------------------------------------------------
set SHARK_OPTR_ADDR     0x40022020
set SHARK_BOOT_MASK     0x0C000000
set SHARK_BOOT_FLASH    0x08000000
set SHARK_SYSMEM_START  0x1FFF0000
set SHARK_SYSMEM_END    0x1FFF8000

proc shark_read_optr {} {
    global SHARK_OPTR_ADDR
    return [lindex [read_memory $SHARK_OPTR_ADDR 32 1] 0]
}

proc shark_boot_is_flash {optr} {
    global SHARK_BOOT_MASK SHARK_BOOT_FLASH
    return [expr {($optr & $SHARK_BOOT_MASK) == $SHARK_BOOT_FLASH}]
}

proc shark_read_pc {} {
    set text [reg pc]
    if {![regexp {0x[0-9a-fA-F]+} $text value]} {
        return -1
    }
    return $value
}

# Fail before reset when the option bytes make the application unreachable.
# Without this check the failure only shows up as a bare wait_halt timeout.
proc shark_check_boot {} {
    set optr [shark_read_optr]
    if {![shark_boot_is_flash $optr]} {
        error [format \
            "FLASH_OPTR=0x%08x selects the system bootloader (nSWBOOT0=0, nBOOT0=0), so the application would never run. Run 'openocd -f openocd/daplink_stm32g4.cfg -c shark_fix_boot' once, then flash again." \
            $optr]
    }
}

# One-time repair of the reset boot option. Safe to run repeatedly.
proc shark_fix_boot {} {
    init
    halt 3000
    set optr [shark_read_optr]
    echo [format "FLASH_OPTR before: 0x%08x" $optr]
    if {[shark_boot_is_flash $optr]} {
        echo "Boot option already selects main Flash; nothing to change."
    } else {
        # value 0x08000000 with mask 0x08000000: touch only nBOOT0 (bit 27).
        stm32l4x option_write 0 0x20 0x08000000 0x08000000
        echo [format "FLASH_OPTR after:  0x%08x" [shark_read_optr]]
        stm32l4x option_load 0
        echo "Option bytes reloaded. Power-cycle the board if it still enters the boot ROM."
    }
    shutdown
}

# Explain a reset that did not stop on the Flash vector. wait_halt returns an
# empty message on timeout, so inspect the CPU state ourselves.
proc shark_describe_reset_failure {entry} {
    global SHARK_SYSMEM_START SHARK_SYSMEM_END
    if {[catch {halt 1000}]} {
        return "the target did not halt after reset"
    }
    set pc [shark_read_pc]
    if {$pc < 0} {
        return "the target could not be inspected after reset"
    }
    if {$pc >= $SHARK_SYSMEM_START && $pc < $SHARK_SYSMEM_END} {
        return "the CPU is in the system bootloader at $pc. FLASH_OPTR or the BOOT0 pin still selects the boot ROM"
    }
    return [format "the CPU halted at %s instead of the Flash reset handler 0x%08x" $pc $entry]
}

# This Horco probe/board combination misses Cortex-M reset vector catch.
# Stop on the Flash reset handler instead, before startup changes peripherals.
# Keep the normal reset command available; reset run does not need this workaround.
proc shark_reset_halt {} {
    poll
    halt 3000
    shark_check_boot
    set vector [lindex [read_memory 0x08000004 32 1] 0]
    set entry [expr {$vector & 0xfffffffe}]
    if {($vector & 1) && $entry >= 0x08000000 && $entry < 0x08020000} {
        bp $entry 2 hw
        set failed [catch {reset run} reason]
        if {!$failed} {
            set failed [catch {wait_halt 3000} reason]
        }
        rbp $entry
        if {$failed} {
            if {$reason eq ""} {
                set reason [shark_describe_reset_failure $entry]
            }
            return -code error "Reset entry was not reached: $reason."
        }
    } else {
        # A blank chip has no Flash reset handler yet; halt its boot ROM.
        reset run
        sleep 100
        halt 3000
    }
}

proc shark_program {image} {
    init
    if {[catch {
        shark_reset_halt
        stm32g4x.cpu invoke-event reset-init
        echo [flash write_image erase $image]
        echo [verify_image $image]
        reset run
    } reason]} {
        echo "SHARK programming failed: $reason"
        shutdown error
    } else {
        echo "SHARK programming and verification passed."
        shutdown
    }
}

# GDB's load operation otherwise ends with the same failing reset halt.
$_TARGETNAME configure -event gdb-flash-write-end { shark_reset_halt }
